[package]
name = "terminus-app"
description = "Terminus application: windows, tabs, splits, config, IPC server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "terminus-gui"
path = "src/main.rs"

[dependencies]
terminus-vt.workspace = true
terminus-input.workspace = true
terminus-pty.workspace = true
terminus-protocol.workspace = true
terminus-font.workspace = true
terminus-render.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
toml = "1"
toml_edit = "0.25"
regex.workspace = true
winit = "0.30"
softbuffer = "0.4"
wgpu = "30"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_WinRT",
    "Win32_System_Diagnostics_Debug",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
terminus-vt.workspace = true
terminus-pty.workspace = true

[target.'cfg(not(windows))'.dependencies]
# The clipboard on macOS, Wayland and X11. Windows uses the Win32 API directly because arboard's
# Windows dependency clipboard-win is BSL 1.0. Default features are off to leave out image support.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
# Raw terminal mode for the latency echo child.
rustix = { version = "1", features = ["termios", "stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications and the Wayland global shortcut portal, both over the session D-Bus. The
# blocking API with the async-io executor keeps tokio out of the tree.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The X11 global hotkey (XGrabKey on the root window). Pure Rust, no libxcb.
x11rb = "0.13"
# The Wayland bell (xdg_system_bell_v1) on its own connection; both are already built for winit.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications through UNUserNotificationCenter.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = ["block2"] }
block2 = "0.6"
