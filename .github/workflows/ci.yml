# Termoil CI (docs/TDD.md section 7, docs/TEST-SUITE.md). Performance numbers from shared runners
# are reported only; the gates are measured on the development machine before each release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window and font crates
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Licences (D1)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - name: Licences on Windows (D1; deny.toml lists the other targets, see its comment)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --target x86_64-pc-windows-msvc
          command: check licenses

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window and font crates
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - run: rustup show
      - name: Fetch the bundled ConPTY pair (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/fetch-conpty.ps1
      - name: Headless crates and tools
        run: cargo test --workspace --no-fail-fast
      - name: Render golden candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-goldens-${{ matrix.os }}
          path: |
            corpus/render/**/*.new.png
            corpus/render/**/*.diff.png
          if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: B1 headless crates build for wasm32
        run: cargo build -p termoil-vt -p termoil-input -p termoil-protocol --target wasm32-unknown-unknown

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window and font crates
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Every fuzz target for 60 seconds
        run: node tools/fuzz-corpus.cjs run 60

  vttest:
    # C2: vttest menus 1, 2 and 8 compared with the reviewed goldens in corpus/vttest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: vttest against termoil-headless
        run: bash tools/vttest/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vttest-screens
          path: _agent_output/vttest/

  esctest:
    # C2: the ratchet file and the 1.0 gate (every test Ghostty 1.4 passes, corpus/esctest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: esctest2 against termoil-headless
        run: bash tools/esctest/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esctest-log
          path: _agent_output/esctest/

  bench:
    # Report only: shared runners are not the machine the gates are measured on.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window and font crates
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
      - run: rustup show
      - run: cargo run --release -p termoil-bench -- throughput 1
      - run: cargo run --release -p termoil-bench -- alloc
