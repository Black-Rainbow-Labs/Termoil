# cargo deny configuration. The licence allow list is the one in docs/TDD.md section 4.1:
# MIT, Apache 2.0, BSD, Zlib, Unicode, and OFL for fonts.
[graph]
all-features = false
# arboard (the clipboard on macOS and Linux) is a dependency of the non Windows targets only. Its
# Windows only dependency clipboard-win is BSL 1.0. cargo deny keeps a crate when any listed target
# reaches the dependency edge that names it, so the Windows target is left out of this list and is
# checked on its own with `cargo deny --target x86_64-pc-windows-msvc check licenses`, which passes.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    # ISC is the two clause BSD licence in other words; counted as BSD.
    "ISC",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
